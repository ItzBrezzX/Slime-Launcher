name: Build APK

on:
  push:
    branches: [main, master, "feature/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Native host tests (parser, scanner, JNI layer, Ready path)
        run: bash native-test/run.sh

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Gradle wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.13
            chmod +x ./gradlew
          fi

      - name: Build debug APK (Slime + Minecraft Android runtime module + native preloaders)
        run: ./gradlew assembleDebug --stacktrace

      - name: Extract native libs from APK
        run: |
          mkdir -p native-ci
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -o "$APK" "lib/**/*.so" -d native-ci || true
          find native-ci -name "*.so" -ls || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slime-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload native .so
        uses: actions/upload-artifact@v4
        with:
          name: slime-native-libs
          path: native-ci/lib
          if-no-files-found: warn

name: Build APK

on:
  push:
    branches: [main, master, "feature/*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Native host tests (parser, scanner, JNI layer, Ready path)
        run: bash native-test/run.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
          fi

      - name: Build debug APK (includes libslime_preloader.so)
        run: ./gradlew assembleDebug --stacktrace

      - name: Extract native libs from APK
        run: |
          mkdir -p native-ci
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -o "$APK" "lib/**/*.so" -d native-ci || true
          find native-ci -name "*.so" -ls || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slime-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload native .so
        uses: actions/upload-artifact@v4
        with:
          name: slime-native-libs
          path: native-ci/lib
          if-no-files-found: warn

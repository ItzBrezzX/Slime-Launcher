name: Bedrock Engine Native Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Run native engine and preloader tests
        run: bash native-test/run.sh
